[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vramfit"
version = "0.1.0"
description = "Estimate whether an LLM inference workload will fit in GPU memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.28,<1",
    "huggingface-hub>=1,<2",
    "rich>=14,<15",
]

[project.scripts]
vramfit = "vramfit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vramfit"]
